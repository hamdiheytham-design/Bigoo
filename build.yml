name: Build Driver Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Generate APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract Driver Pro ZIP
        run: |
          ZIP_FILE="DriverPro_V3.6_Review_Fixes.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Driver Pro ZIP not found"
            ls -la
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/driverpro"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/driverpro"

          echo "ZIP extracted successfully"

      - name: Find Android project
        run: |
          APP_FILE=$(find "$RUNNER_TEMP/driverpro" \
            -type f \( -path '*/app/build.gradle' -o -path '*/app/build.gradle.kts' \) \
            | head -n 1)

          if [ -z "$APP_FILE" ]; then
            echo "ERROR: Android app folder not found in ZIP"
            find "$RUNNER_TEMP/driverpro" -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$(dirname "$APP_FILE")")

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output

          APK=$(find "$PROJECT_DIR" \
            -path '*/build/outputs/apk/debug/*.apk' \
            -type f | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not generated"
            exit 1
          fi

          cp "$APK" output/Driver-Pro.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Driver-Pro-APK
          path: output/Driver-Pro.apk
          if-no-files-found: error
          retention-days: 14
