name: Build Driver Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Verify Android project
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/driverpro/app/MainActivity.java
          test -f app/src/main/assets/index.html
          echo "Project structure OK"

      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          scripts = re.findall(
              r'<script(?:\s[^>]*)?>(.*?)</script>',
              html,
              re.S | re.I
          )

          inline = [s for s in scripts if s.strip()]

          if not inline:
              raise SystemExit('No inline JavaScript found')

          Path('/tmp/driverpro-inline.js').write_text(
              '\n;\n'.join(inline),
              encoding='utf-8'
          )

          print(f'Extracted {len(inline)} script blocks')
          PY

          node --check /tmp/driverpro-inline.js

      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Driver-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
